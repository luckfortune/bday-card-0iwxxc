<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<title>一封生日信</title>
<style>
@font-face{font-family:'WenkaiCard';src:url(font.woff2) format('woff2');font-display:block}
html,body{margin:0;height:100%;background:#07061a;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;font-family:'WenkaiCard',serif;color:#e9e6ff;z-index:2}
#intro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 1.4s ease,filter 1.4s ease;background:radial-gradient(ellipse 70% 45% at 50% 52%,rgba(6,5,22,.55),rgba(6,5,22,0) 75%)}
#intro.out{opacity:0;filter:blur(6px)}
#intro>*{animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
#intro .t0{animation-delay:.2s}#intro .orn{animation-delay:.35s}#intro .t1{animation-delay:.5s}#intro .t2{animation-delay:.8s}#intro .tap{animation-delay:1.2s}
@keyframes rise{from{opacity:0;transform:translateY(12px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
#intro .t0{font-size:11px;letter-spacing:.5em;padding-left:.5em;word-spacing:-.3em;color:#f3dcbc;opacity:.8;margin-bottom:22px}
#intro .orn{display:flex;align-items:center;gap:12px;margin-bottom:20px;opacity:.9}
#intro .orn i{display:block;width:clamp(46px,16vw,80px);height:1px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.7))}
#intro .orn i:last-child{background:linear-gradient(90deg,rgba(255,220,170,.7),transparent)}
#intro .orn svg{width:16px;height:16px;filter:drop-shadow(0 0 6px rgba(255,214,150,.9));animation:twk 3.2s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(.85) rotate(0);opacity:.75}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
#intro .t1{font-size:clamp(40px,11vw,60px);letter-spacing:.3em;padding-left:.3em;line-height:1.2;
  background:linear-gradient(100deg,#efe6ff 0%,#ffd9a8 32%,#fff8ec 50%,#ffd9a8 68%,#efe6ff 100%);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(255,200,150,.28)) drop-shadow(0 0 2px rgba(255,240,220,.4));animation:rise 1.8s cubic-bezier(.2,.7,.2,1) .5s both,sheen 6.5s ease-in-out 2s infinite}
@keyframes sheen{0%,100%{background-position:100% 0}50%{background-position:0 0}}
#intro .t2{font-size:14px;letter-spacing:.28em;padding-left:.28em;color:#f1e4d0;opacity:.82;margin-top:16px}
#intro .tap{margin-top:58px;display:flex;flex-direction:column;align-items:center;gap:34px}
#intro .tap .ring{position:relative;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,226,186,.55);box-shadow:0 0 18px rgba(255,200,140,.25),inset 0 0 12px rgba(255,210,160,.15)}
#intro .tap .ring::before{content:'';position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff2dc;box-shadow:0 0 10px 3px rgba(255,210,150,.8)}
#intro .tap .ring::after{content:'';position:absolute;inset:-1px;border-radius:50%;border:1px solid rgba(255,226,186,.6);animation:ring 2.4s ease-out infinite}
#intro .t3{font-size:13px;letter-spacing:.3em;padding-left:.3em;color:#ffe2b8;text-shadow:0 0 12px rgba(255,200,140,.5);animation:breath 2.6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.7);opacity:0}}
#wish{inset:0;padding-bottom:26vh;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
#wish.show{opacity:1}#wish.hide{opacity:0;transition:opacity 1.4s ease}
#wish .w-orn{display:flex;align-items:center;gap:12px;margin-bottom:22px;opacity:0;transform:scale(.6);transition:all 1.4s cubic-bezier(.2,.7,.2,1) .1s}
#wish.show .w-orn{opacity:.95;transform:none}
#wish .w-orn i{display:block;width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,220,170,.8));transition:width 1.6s cubic-bezier(.2,.7,.2,1) .3s}
#wish .w-orn i:last-child{background:linear-gradient(90deg,rgba(255,220,170,.8),transparent)}
#wish.show .w-orn i{width:clamp(50px,17vw,90px)}
#wish .w-orn svg{width:18px;height:18px;filter:drop-shadow(0 0 8px rgba(255,214,150,1));animation:twk 3.2s ease-in-out infinite}
#wish .w1{display:flex;gap:.18em;font-size:clamp(40px,12vw,68px);line-height:1.2;padding-left:.18em}
#wish .w1 span{display:inline-block;opacity:0;transform:translateY(18px) scale(.9);filter:blur(10px);
  background:linear-gradient(170deg,#fff8ec 0%,#ffe0b0 45%,#f6b98a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:opacity 1.3s ease,transform 1.6s cubic-bezier(.2,.8,.2,1),filter 1.4s ease}
#wish.show .w1 span{opacity:1;transform:none;filter:drop-shadow(0 0 14px rgba(255,190,120,.55)) drop-shadow(0 0 2px rgba(255,245,225,.6))}
#wish.show .w1 span:nth-child(1){transition-delay:.25s}#wish.show .w1 span:nth-child(2){transition-delay:.45s}#wish.show .w1 span:nth-child(3){transition-delay:.65s}#wish.show .w1 span:nth-child(4){transition-delay:.85s}#wish.show .w1 span:nth-child(5){transition-delay:1.05s}
#wish .w2{margin-top:20px;font-size:clamp(15px,4.3vw,18px);letter-spacing:.38em;padding-left:.38em;color:#fbecd6;text-shadow:0 0 12px rgba(255,200,140,.35);opacity:0;transform:translateY(8px);transition:all 1.6s ease 1.5s}
#wish.show .w2{opacity:.95;transform:none}
@keyframes twk{0%,100%{transform:scale(.85) rotate(0);opacity:.75}50%{transform:scale(1.15) rotate(45deg);opacity:1}}
#ho{position:fixed;inset:0;z-index:99;pointer-events:none}
#ho .bg{position:absolute;inset:0;background:#07061a}
#ho .gl{position:absolute;left:0;top:0;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.42) 0%,rgba(255,170,140,.16) 28%,rgba(150,120,255,.10) 52%,transparent 70%)}
#ho .st{position:absolute;left:0;top:0}
#ho .st svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,235,200,1)) drop-shadow(0 0 30px rgba(255,200,140,.9))}
#intro .orn.pop svg{animation:pop .9s ease-out both, twk 3.2s ease-in-out .9s infinite}
@keyframes pop{0%{transform:scale(1.8);filter:drop-shadow(0 0 16px rgba(255,230,190,1))}100%{transform:scale(1)}}
#hint{left:0;right:0;top:calc(9vh + env(safe-area-inset-top));text-align:center;pointer-events:none;transition:opacity .9s ease;opacity:0}
#hint::before{content:'';position:absolute;left:50%;top:50%;width:min(360px,86vw);height:110px;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(7,6,26,.62),rgba(7,6,26,0) 70%);z-index:-1}
#hint .h1{font-size:clamp(16px,4.4vw,21px);letter-spacing:.18em;text-shadow:0 0 18px rgba(150,130,255,.7),0 0 4px rgba(0,0,0,.8)}
#hint.wave .h1{position:relative;display:inline-block;padding:0 .4em;
  background:linear-gradient(100deg,#e9e4ff 0%,#e9e4ff 38%,#fff6e2 47%,#ffe0b0 50%,#fff6e2 53%,#e9e4ff 62%,#e9e4ff 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 10px rgba(170,150,255,.75));animation:hsweep 2.6s ease-in-out infinite,hglow 2.6s ease-in-out infinite}
@keyframes hsweep{0%{background-position:100% 0}60%,100%{background-position:0 0}}
@keyframes hglow{0%,100%{filter:drop-shadow(0 0 8px rgba(170,150,255,.6))}45%{filter:drop-shadow(0 0 16px rgba(255,215,160,.95)) drop-shadow(0 0 3px rgba(255,240,220,.8))}}
#hint.wave .h1::before,#hint.wave .h1::after{content:'';position:absolute;left:50%;top:50%;width:100%;height:2.2em;transform:translate(-50%,-50%) scale(.6);border-radius:999px;border:1px solid rgba(255,220,170,.7);box-shadow:0 0 14px rgba(255,200,140,.45),inset 0 0 10px rgba(200,180,255,.3);opacity:0;animation:hring 2.6s ease-out infinite}
#hint.wave .h1::after{animation-delay:1.3s;border-color:rgba(200,180,255,.6)}
@keyframes hring{0%{transform:translate(-50%,-50%) scale(.7,.6);opacity:0}15%{opacity:.9}100%{transform:translate(-50%,-50%) scale(1.25,1.6);opacity:0}}
#hint.mid{top:31vh}
#hint.cutpos{top:27vh}
#hint.cutpos .h1{font-size:clamp(20px,5.6vw,26px);color:#fff4e2;text-shadow:0 0 18px rgba(255,190,120,.7),0 0 3px rgba(0,0,0,.9)}
#hint.cutpos .h2{font-size:clamp(13px,3.7vw,15px);opacity:.9;margin-top:10px}
#hint.mid .h1{font-size:clamp(22px,6.4vw,30px);letter-spacing:.14em;color:#fff4e2;text-shadow:0 0 20px rgba(255,190,120,.75),0 0 6px rgba(255,220,180,.6),0 0 3px rgba(0,0,0,.9)}
#hint.mid .h2{font-size:clamp(14px,4vw,17px);margin-top:12px;opacity:.9}
#hint .h2{font-size:12.5px;letter-spacing:.16em;opacity:.78;margin-top:8px}
#top{left:0;right:0;top:calc(2.6vh + env(safe-area-inset-top));text-align:center;font-size:11px;letter-spacing:.7em;padding-left:.7em;opacity:0;pointer-events:none;transition:opacity 2s;color:#f0dcc0}
#mute{right:calc(14px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top));width:38px;height:38px;border-radius:50%;border:1px solid rgba(233,230,255,.22);background:rgba(20,16,50,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:15px;cursor:pointer;opacity:0;transition:opacity 1s;padding:0;line-height:36px}
#mute.off{opacity:.45 !important;text-decoration:line-through}
#replay{right:calc(50% + 7px);bottom:calc(4.2vh + env(safe-area-inset-bottom));transform:translateY(12px);padding:11px 22px 11px 26px;border-radius:999px;border:1px solid rgba(255,214,150,.5);background:linear-gradient(180deg,rgba(70,48,90,.5),rgba(28,18,48,.55));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;letter-spacing:.4em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.2s ease,transform 1.2s ease;box-shadow:0 0 26px rgba(255,190,120,.18),inset 0 0 12px rgba(255,220,170,.08);color:#ffe9c8;white-space:nowrap}
#replay.show{opacity:1;pointer-events:auto;transform:none}
#replay:active{transform:translateY(1px) scale(.97)}
#next{left:calc(50% + 7px);bottom:calc(4.2vh + env(safe-area-inset-bottom));transform:translateY(12px);padding:11px 20px 11px 26px;border-radius:999px;border:1px solid rgba(255,220,160,.75);background:linear-gradient(180deg,rgba(255,200,140,.42),rgba(200,120,110,.28));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:15px;letter-spacing:.4em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.2s ease .25s,transform 1.2s ease .25s;box-shadow:0 0 30px rgba(255,190,120,.35),inset 0 0 12px rgba(255,230,190,.15);color:#fff6e6;text-shadow:0 1px 6px rgba(90,40,20,.4);white-space:nowrap;overflow:hidden}
#next::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,250,235,.5),transparent);transform:skewX(-20deg);animation:nglint 3.6s ease-in-out 1.5s infinite}
@keyframes nglint{0%{left:-60%}40%,100%{left:130%}}
#next.show{opacity:1;pointer-events:auto;transform:none}
#next:active{transform:translateY(1px) scale(.97)}
#next .ar{display:inline-block;letter-spacing:0;margin-left:-.1em;animation:nar 1.6s ease-in-out infinite}
@keyframes nar{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
#c{transition:filter 1.4s ease}
#c.away{filter:blur(8px) brightness(.5)}
#c.fadeout{opacity:0;transition:opacity .4s ease}
#grade{position:fixed;inset:0;z-index:20;pointer-events:none;background:radial-gradient(ellipse 120% 90% at 50% 45%,rgba(0,0,0,0) 50%,rgba(6,3,18,.7) 100%),linear-gradient(180deg,rgba(80,50,140,.06),rgba(0,0,0,0) 40%,rgba(255,170,120,.04))}
#grain{position:fixed;inset:-50%;z-index:21;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:180px 180px;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-5%)}60%{transform:translate(-6%,-2%)}80%{transform:translate(5%,4%)}100%{transform:translate(0,0)}}
#party{position:fixed;inset:0;z-index:4;opacity:0;pointer-events:none;transition:opacity 1.8s ease;background:#05041a;font-family:'WenkaiCard',serif;color:#ffe9c8;touch-action:none}
#party.on{opacity:1;pointer-events:auto}
#party canvas{position:absolute;inset:0;width:100%;height:100%}
#p-bloom{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s ease;background:radial-gradient(ellipse at 50% 38%,rgba(255,205,185,.24),rgba(255,160,170,.10) 45%,rgba(130,50,80,.26) 100%);mix-blend-mode:screen}
#p-bloom::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,220,170,.16),rgba(255,170,180,.10));mix-blend-mode:soft-light}
#p-bloom.on{opacity:1}
#party.bloom canvas{filter:saturate(1.12) contrast(1.03)}
#party .p-top{position:absolute;left:0;right:0;top:calc(2.6vh + env(safe-area-inset-top));text-align:center;font-size:11px;letter-spacing:.7em;padding-left:.7em;color:#e8dcff;opacity:.75}
#p-back{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(2.2vh + env(safe-area-inset-bottom));padding:8px 18px 8px 14px;border-radius:999px;border:1px solid rgba(255,225,190,.3);background:rgba(20,16,50,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#ffe9c8;font-family:inherit;font-size:13px;letter-spacing:.2em;cursor:pointer;opacity:0;transition:opacity 1s ease 3s}
#party.on #p-back{opacity:.85}
#p-tray{position:absolute;left:calc(10px + env(safe-area-inset-left));right:0;bottom:calc(2.2vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:8px;opacity:0;transition:opacity 1s;pointer-events:none;z-index:3}
#p-tray.show{opacity:1}
#party.show-bq #p-tray{opacity:0}
#p-tray .tg{pointer-events:auto;font:inherit;font-size:13px;color:#ffe9c8;padding:7px 13px;border-radius:999px;border:1px solid rgba(255,214,170,.45);background:rgba(40,22,50,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 14px rgba(255,180,140,.25);animation:tgp 2.6s ease-in-out infinite}
@keyframes tgp{50%{box-shadow:0 0 22px rgba(255,190,150,.55)}}
#p-tray .row{display:flex;gap:6px;max-width:calc(100vw - 20px);flex-wrap:wrap;padding:6px;border-radius:16px;background:rgba(22,12,36,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,220,190,.2);opacity:0;transform:translateY(8px) scale(.96);transform-origin:left bottom;transition:opacity .35s,transform .35s;pointer-events:none}
#p-tray.open .row{opacity:1;transform:none;pointer-events:auto}
#p-tray .sl{position:relative;flex:0 0 auto;width:min(11.6vw,58px);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 5px;border-radius:12px;border:1px solid rgba(255,220,190,.22);background:rgba(50,28,60,.6);color:#ffe9d6;font:inherit;font-size:11px;cursor:pointer;transition:transform .2s}
#p-tray .sl:active{transform:scale(.9)}
#p-tray .sl img{width:84%;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
#p-tray .sl i{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:hsl(var(--h),90%,70%);box-shadow:0 0 6px hsl(var(--h),90%,70%)}
#p-tray .sl.seen{border-color:rgba(255,214,150,.7)}
#p-tray .sl span{white-space:nowrap}
#p-hint{position:absolute;left:0;right:0;top:calc(7.5vh + env(safe-area-inset-top));text-align:center;color:#ffe2b8;text-shadow:0 0 12px rgba(255,190,120,.7),0 0 3px rgba(0,0,0,.8);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#p-hint .a{font-size:clamp(15px,4.2vw,19px);letter-spacing:.2em;padding-left:.2em}
#p-hint .b{margin-top:6px;font-size:12.5px;letter-spacing:.3em;padding-left:.3em;opacity:.8}
#p-hint.show{opacity:1;animation:phint 2.4s ease-in-out infinite}
#party.bloom #p-hint.show{opacity:.85}
#party.show-bq #p-hint.show{opacity:0;animation:none;transition:opacity .6s}
@keyframes phint{0%,100%{opacity:.75}50%{opacity:1}}
#mute{z-index:6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grade"></div><div id="grain"></div>
<div id="intro" class="ui">
  <div class="t0">HAPPY BIRTHDAY</div>
  <div class="orn"><i></i><svg viewBox="0 0 64 64"><path fill="#ffe6bf" d="M32 2C34 22 42 30 62 32C42 34 34 42 32 62C30 42 22 34 2 32C22 30 30 22 32 2Z"/></svg><i></i></div>
  <div class="t1"></div>
  <div class="tap"><div class="ring"></div><div class="t3">轻触开启</div></div>
</div>
<div id="wish" class="ui"><div class="w-orn"><i></i><svg viewBox="0 0 64 64"><path fill="#ffe6bf" d="M32 2C34 22 42 30 62 32C42 34 34 42 32 62C30 42 22 34 2 32C22 30 30 22 32 2Z"/></svg><i></i></div><div class="w1"><span>愿</span><span>望</span><span>已</span><span>收</span><span>到</span></div><div class="w2">愿你所愿 · 皆能成真</div></div>
<div id="top" class="ui">HAPPY BIRTHDAY</div>
<div id="hint" class="ui"><div class="h1"></div><div class="h2"></div></div>
<button id="mute" class="ui" aria-label="声音">♪</button>
<button id="replay" class="ui">再来一遍</button>
<button id="next" class="ui">下一页 <span class="ar">›</span></button>
<div id="party"><canvas id="p-sky"></canvas><canvas id="p-fw"></canvas><canvas id="p-fg"></canvas><div id="p-bloom"></div>
  <div class="p-top">HAPPY BIRTHDAY</div><button id="p-back">‹ 回到信</button><div id="p-hint"><div class="a">点一下屏幕，放一朵你的烟花</div><div class="b">可以多次点击任意地方</div></div></div>
<script>
'use strict';
// ───────────────────────── 数据 ─────────────────────────
// 卡片数据：线上版由密码页解密后注入 window.__CARD；本地预览用内置示例
const CARD = window.__CARD || {"to": "你", "from": "", "body": ["（这封信需要从链接打开）"]};
const LETTER = [CARD.title || (CARD.to + '，生日快乐！'), ...CARD.body, 'by' + CARD.from];   // 标题 / 正文段落 / 署名
const PHOTOS = (CARD.photos || []).slice(0, 8);
const HASGOLD = /The best/.test(LETTER[LETTER.length - 2]), GOLD_P = HASGOLD ? LETTER.length - 2 : -1;
const CANDLE_FROM = HASGOLD ? LETTER.length - 2 : LETTER.length - 1;   // 金句 + 署名 缠在蜡烛上     // 最后一段祝愿 + 署名 写在蜡烛上
const FF = 'WenkaiCard,"PingFang SC","Microsoft YaHei",serif';
document.querySelector('#intro .t1').textContent = '致' + CARD.to; document.title = '致' + CARD.to + '，生日快乐';
if (Array.from(CARD.to).length > 4) document.querySelector('#intro .t1').style.fontSize = 'clamp(30px,8vw,46px)';
const CFG = {
  writeDur: 3.4,        // 开场：字沿一笔画写出蛋糕（秒）
  autoPeel: [9, 26],   // 松手后自动剥落速度（字/秒，起→止）
  gravity: 1.7,         // ×屏高 px/s²
  spread: 1.42,         // 落下后字距 = 蛋糕上字距 × spread
  blowNeed: 1.0,        // 吹气能量阈值
  startVol: .6,         // 开场音乐音量
  endVol: .9,           // 信展开后音乐音量
  flyStagger: 11,      // 组字：从第一个到最后一个字起飞的时间差
  flyDur: 1.5,          // 每个字的飞行时长
  wishAt: 1.9,          // 吹灭后多久出现「愿望已收到」
  wishHold: 3.6,        // 标题停留
  blownLen: 7.2,        // 吹灭段总长，之后开始组字
};
const PAL = {
  plate: '#d4d8f6', body: '#efe6fb', top: '#f7bfd7', drip: '#f39fc4', candle: '#f8d690',
  ink: '#f4ebe0', title: '#ffd2b4', gold: '#ffd889', sign: '#e2cdf0', warm: '#ffd6a0',
};

// ───────────────────────── 工具 ─────────────────────────

    st.animate([{ transform: at(s.x, s.y, 1, s.rot) }, { transform: at(s.x, s.y - 6, 1.1, s.rot + 25), offset: .15 }, { transform: at((s.x + tx) / 2 + 55, (s.y + ty) / 2 - 40, (1 + sc) / 2, s.rot + 110), offset: .6 }, { transform: at(tx, ty, sc, s.rot + 180) }], { duration: D, easing: E, fill: 'forwards' })
      .onfinish = () => {
        svg.style.visibility = ''; orn.classList.add('pop');
        lines.forEach(l => { l.style.transition = 'width 1.4s cubic-bezier(.2,.7,.2,1)'; l.style.width = ''; });
        st.getAnimations().forEach(a => a.cancel()); st.style.transform = at(tx, ty, sc, s.rot + 180);
        st.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
        setTimeout(() => ov.remove(), 700);
      };
    gl.animate([{ transform: `translate(${s.x}px,${s.y}px) scale(1.65)`, opacity: 1 }, { transform: `translate(${tx}px,${ty}px) scale(.3)`, opacity: 0 }], { duration: D, easing: E, fill: 'forwards' });
    bg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1600, delay: 200, easing: 'ease-in-out', fill: 'forwards' });
    setTimeout(() => intro.forEach(el => el.getAnimations().forEach(a => a.play())), D * .12);
  }
  // 等贺卡首帧稳定（字体、蝴蝶都就绪、连续两帧不卡）再起飞
  let lastT = 0, good = 0; const t0 = performance.now();
  (function wait(tm) { if (window.__card && lastT && tm - lastT < 40) good++; else good = 0; lastT = tm;
    if (good >= 1 || tm - t0 > 1500) fly(); else requestAnimationFrame(wait); })(0);
})();
</script>
